<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'sha256-YuJW7ahBk7cvKhIekgwMgmKJp+nysee2jQRZWgHkKPk='; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'"><title>Retorno Mercado Livre • Essência</title><style>body{font:16px/1.6 system-ui,sans-serif;background:#f7f8f5;color:#344f43;max-width:680px;margin:10vh auto;padding:24px}main{padding:32px;background:white;border:1px solid #dfe5d7;border-radius:14px}h1{font:32px Georgia,serif}input{display:block;width:100%;box-sizing:border-box;padding:12px;border:1px solid #dfe5d7;border-radius:6px}button{margin-top:16px;background:#344f43;color:white;padding:12px 20px;border:0;border-radius:6px;cursor:pointer}small{display:block;margin-top:24px;color:#73816e}</style></head><body><main><p>ESSÊNCIA • MERCADO LIVRE</p><h1>Página de retorno do Essência</h1><p id="instructions">Esta página recebe o retorno da sua aplicação.</p><div id="result" hidden><label for="callback">URL de retorno para concluir no seu aplicativo local</label><input id="callback" readonly autocomplete="off"><button type="button">Copiar URL de retorno</button></div><small>Não compartilhe esta URL. Esta página não envia seu código a outros serviços e não recebe sua senha ou Secret Key.</small><noscript>Ative JavaScript ou copie a URL da barra de endereços e cole no aplicativo local, em Conexões.</noscript></main><script>const original = location.href;
const query = new URL(original).searchParams;
const valid = query.has('code') && query.has('state') && !query.has('error');
document.querySelector('h1').textContent = valid ? 'Autorização recebida' : 'Página de retorno do Essência';
document.querySelector('#result').hidden = !valid;
document.querySelector('#instructions').textContent = valid ? 'Volte ao Essência, em Conexões, e cole a URL abaixo em “URL completa recebida depois da autorização”. Conclua a conexão no aplicativo local.' : 'Esta página recebe o retorno da sua aplicação do Mercado Livre. Inicie a autorização pelo Essência, em Conexões.';
document.querySelector('#callback').value = valid ? original : '';
if (query.size) history.replaceState(null, '', location.pathname);
document.querySelector('button').addEventListener('click', async () => { try { await navigator.clipboard.writeText(original); document.querySelector('button').textContent = 'URL copiada'; } catch { document.querySelector('#callback').select(); } });</script></body></html>
